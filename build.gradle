// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        mavenCentral()
        // jcenter()
        google()
        maven {
            url 'https://maven.aliyun.com/repository/public'
        }
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://repo1.maven.org/maven2/' }

    }
    dependencies {
        // AGP 8.x is required to compile against Android 15/16 (compileSdk 35/36).
        // Requires JDK 17 and Gradle 8.7 (see gradle/wrapper/gradle-wrapper.properties).
        classpath 'com.android.tools.build:gradle:8.5.2'
        // gradle-experimental:0.11.1 removed — it is incompatible with AGP 8 and unused.
    }
}

allprojects {
    repositories {
        mavenLocal()
        // jcenter()
        google()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

apply plugin: 'com.android.library'

android {
    namespace 'com.lody.virtual'
    compileSdk 35
    // buildToolsVersion omitted: AGP selects the version required by compileSdk (35.0.0).
    // ndkVersion intentionally kept at 21.4.7075529 — the native engine
    // (And64InlineHook / Substrate / IOUniformer) targets syscalls, not the SDK, so
    // bumping the NDK adds risk with no functional benefit. If AGP 8.5 rejects r21,
    // install NDK r25c (25.2.9519653) or r26 and update the line below.

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 22
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path file("src/main/jni/Android.mk")
        }
    }
    ndkVersion "21.4.7075529"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        //IJobService need NewApi
        warning 'NewApi','OnClick'
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    api("me.weishu.exposed:exposed-core:0.8.1") {
        exclude group: 'me.weishu', module: 'free_reflection'
        exclude group: 'me.weishu', module: 'epic'
        exclude group: 'me.weishu.exposed', module: 'exposed-xposedapi'
    }
    implementation "me.weishu:free_reflection:3.0.1"
    implementation "me.weishu:epic:0.11.1"
    implementation "me.weishu.exposed:exposed-xposedapi:0.4.6"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"
}

repositories {
    maven { url 'https://jitpack.io' }
    jcenter()
    google()
    mavenCentral()
}
